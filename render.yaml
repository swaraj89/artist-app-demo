services:
  - type: web
    name: artist-service
    env: docker
    region: singapore
    plan: free
    dockerfilePath: ./service/Dockerfile
    dockerContext: ./service
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        sync: false
      - key: BATCH_JOB_ENABLED
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: https://artist-app-ci2o.onrender.com/

  - type: web
    name: artist-ui
    env: docker
    region: singapore
    plan: free
    dockerfilePath: ./ui/Dockerfile
    dockerContext: ./ui
    envVars:
      - key: VITE_API_BASE_URL
        value: https://artist-service.onrender.com
